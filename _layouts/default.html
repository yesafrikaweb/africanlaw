<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - AfricanLaw</title>
    <style>
        :root {
            --gov-blue: #0b0c0c;
            --gov-link: #1d70b8;
            --gov-link-hover: #003078;
            --gov-border: #b1b4b6;
            --gov-bg: #f3f2f1;
            --gov-white: #ffffff;
            --text-color: #0b0c0c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text-color); background-color: var(--gov-white); line-height: 1.5; }
        
        header { background-color: var(--gov-blue); color: var(--gov-white); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gov-link); }
        header .site-title { font-size: 1.25rem; font-weight: 700; color: var(--gov-white); text-decoration: none; }
        
        .breadcrumb-bar { background-color: var(--gov-bg); padding: 10px 24px; font-size: 0.875rem; border-bottom: 1px solid var(--gov-border); }
        .breadcrumb-bar a { color: var(--gov-link); text-decoration: none; }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 40px; padding: 30px 24px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        aside nav h3 { font-size: 1rem; margin-bottom: 12px; text-transform: uppercase; color: #505a5f; }
        aside ul { list-style: none; border-left: 2px solid var(--gov-border); padding-left: 12px; }
        aside ul li { margin-bottom: 8px; }
        aside ul li a { color: var(--gov-link); text-decoration: none; font-size: 0.95rem; }

        main { max-width: 768px; }
        .document-metadata { font-size: 0.875rem; color: #505a5f; margin-bottom: 16px; text-transform: uppercase; }
        h1.document-title { font-size: 2.25rem; font-weight: 700; line-height: 1.15; margin-bottom: 24px; }

        .section-block { margin-bottom: 40px; position: relative; }
        .section-number { position: absolute; left: -60px; font-weight: bold; color: #505a5f; font-size: 0.9rem; }
        @media (max-width: 1000px) { .section-number { position: static; display: block; margin-bottom: 4px; } }
        .section-header { font-size: 1.25rem; font-weight: 600; margin-bottom: 12px; }
        p.provision-text { margin-bottom: 16px; font-size: 1.1rem; line-height: 1.6; }

        footer { background-color: var(--gov-bg); border-top: 1px solid var(--gov-border); padding: 24px; text-align: center; font-size: 0.875rem; color: #505a5f; margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <a href="{{ site.baseurl }}/" class="site-title">AfricanLaw Open Legislation</a>
        <div style="font-size: 0.9rem;">Public Domain Legal Repository</div>
    </header>

    <div class="breadcrumb-bar">
        <a href="{{ site.baseurl }}/">Home</a> &gt; <span>{{ page.title }}</span>
    </div>

    <div class="container">
        <aside>
            <nav>
                <h3>Document Contents</h3>
                <ul>
                    <li><a href="#section-1">1. Short title</a></li>
                    <li><a href="#section-2">2. Interpretation</a></li>
                </ul>
            </nav>
        </aside>

        <main>
            <div class="document-metadata">African Model Legislation Archive</div>
            <h1 class="document-title">{{ page.title }}</h1>
            
            <div class="legislation-provisions">
                {{ content }}
            </div>
        </main>
    </div>

    <footer>
        <p>Powered by GitHub Pages &bull; Designed after official open-data gazette patterns.</p>
    </footer>

</body>
</html>
